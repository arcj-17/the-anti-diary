name: Build and Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect build output and if repo has package.json
        id: detect
        run: |
          has_package=false
          output_dir=""
          if [ -f package.json ]; then has_package=true; fi
          if [ -d public ]; then output_dir=public
          elif [ -d build ]; then output_dir=build
          elif [ -d dist ]; then output_dir=dist
          elif [ -f index.html ]; then output_dir="."
          fi
          echo "has_package=$has_package" >> $GITHUB_OUTPUT
          echo "output_dir=$output_dir" >> $GITHUB_OUTPUT

      - name: Setup Node (only if package.json present)
        if: ${{ steps.detect.outputs.has_package == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build (only if package.json present)
        if: ${{ steps.detect.outputs.has_package == 'true' }}
        run: |
          npm ci
          # If a build script exists in package.json, run it; otherwise skip
          node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)" && npm run build || echo "No build script; skipping npm run build"

      - name: Inspect build output (diagnostic)
        run: |
          echo "Detected output_dir: ${{ steps.detect.outputs.output_dir }}"
          echo "--- Top-level files ---"
          ls -la || true
          echo "--- Contents of detected output ---"
          ls -la "${{ steps.detect.outputs.output_dir }}" || true
          echo "--- Find index.html anywhere (for debugging) ---"
          find . -maxdepth 6 -type f -name 'index.html' -print || true

      - name: Fail if no output found
        if: ${{ steps.detect.outputs.output_dir == '' }}
        run: |
          echo "ERROR: No build output detected (no public/build/dist folder or index.html at repo root)."
          echo "If your site requires a build, add a build step that creates one of: public/, build/, dist/, or an index.html at repo root."
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ${{ steps.detect.outputs.output_dir }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
